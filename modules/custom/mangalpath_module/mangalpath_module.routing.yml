mangalpath_module.dashboard:
  path: '/partner/dashboard'
  defaults:
    _controller: '\Drupal\mangalpath_module\Controller\PartnerDashboardController::dashboard'
    _title: 'Partner Dashboard'
  requirements:
    _permission: 'access content'
